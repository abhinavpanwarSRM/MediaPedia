<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPedia — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; color: #1db954; }
    p { color: #888; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6; }
    button {
      background: #1db954; border: none; border-radius: 40px;
      padding: 0.8rem 2rem; font-size: 1rem; font-weight: 700;
      color: #000; cursor: pointer;
    }
    button:hover { background: #1ed760; }
  </style>
</head>
<body>
  <div>
    <div class="icon">🎵</div>
    <h1>You're offline</h1>
    <p>No internet connection.<br>Your party will resume when you're back online.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
