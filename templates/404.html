<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.png') }}"
      type="image/x-icon"
    />
    <title>404</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: default;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, rgba(15, 15, 15, 0.9) 0%, rgba(26, 26, 26, 0.9) 100%);
        color: #fff;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        overflow: hidden;
        position: relative;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: var(--poster-bg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -1;
        opacity: 0.3;
        transition: opacity 0.5s ease;
      }

      .container {
        max-width: 800px;
        width: 100%;
        z-index: 1;
      }

      .error-code {
        font-size: 15rem;
        font-weight: 900;
        color: #e50914;
        margin-bottom: 1rem;
        text-shadow: 0 0 30px rgba(229, 9, 20, 0.5);
        line-height: 1;
        letter-spacing: -5px;
      }

      .error-text {
        font-size: 2rem;
        margin-bottom: 3rem;
        opacity: 0.9;
        font-weight: 300;
      }

      .back-btn {
        background: #e50914;
        color: white;
        border: none;
        padding: 18px 50px;
        font-size: 1.2rem;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .back-btn:hover {
        background: #b2070f;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
      }

      @media (max-width: 900px) {
        .error-code {
          font-size: 8rem;
        }
        .error-text {
          font-size: 1.3rem;
        }
        .back-btn {
          padding: 12px 35px;
          font-size: 1rem;
        }
      }
      @media (max-width: 480px) {
        .error-code { font-size: 5.5rem; letter-spacing: -2px; }
        .error-text { font-size: 1.1rem; margin-bottom: 2rem; }
        .back-btn { padding: 10px 28px; font-size: 0.95rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>
      <div class="error-text">NOT FOUND</div>
      <button onclick="goBack()" class="back-btn">← Go Back</button>
    </div>

    <script>
      // List of poster filenames in your static/poster folder
      const posters = [
        "poster1.jpg", "poster2.jpg", "poster3.jpg", "poster4.jpg", 
        "poster5.jpg", "poster6.jpg", "poster7.jpg", "poster8.jpg",
        "poster9.jpg", "poster10.jpg", "poster11.jpg", "poster12.jpg"
      ];

      function getRandomPoster() {
        // Select a random poster from the list
        const randomIndex = Math.floor(Math.random() * posters.length);
        const posterFile = posters[randomIndex];
        
        // Create the full URL to the poster in your static folder
        const posterUrl = "{{ url_for('static', filename='poster/') }}" + posterFile;
        
        return posterUrl;
      }

      function setRandomPosterBackground() {
        const posterUrl = getRandomPoster();
        document.body.style.setProperty('--poster-bg', `url('${posterUrl}')`);
      }

      function goBack() {
        if (document.referrer) {
          window.history.back();
        } else {
          window.location.href = "/";
        }
      }

      // Set random poster background when page loads
      document.addEventListener("DOMContentLoaded", setRandomPosterBackground);
    </script>
  </body>
</html>
