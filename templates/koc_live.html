<!DOCTYPE html>
<html>
<head>
  <title>KOC Live — MediaPedia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="{{ url_for('static', filename='koc/icon.png') }}" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#ffd700;--gold2:#b8860b;--bg:#0d0d0d;--card:rgba(255,215,0,0.04);--border:rgba(255,215,0,0.12);--text:#fff;--muted:#888;--primary:#e50914; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh;}
    .topnav{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,13,13,.97);backdrop-filter:blur(8px);z-index:100;gap:.8rem;}
    .topnav a{color:var(--muted);text-decoration:none;font-size:.85rem;transition:color .2s;}
    .topnav a:hover{color:#fff;} .topnav .brand{color:var(--primary);font-weight:700;font-size:1rem;}
    .nav-right{display:flex;gap:1rem;align-items:center;}
    .nav-burger{display:none;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:4px;}
    .nav-burger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;}
    .nav-drawer{display:none;flex-direction:column;background:rgba(13,13,13,.98);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:99;}
    .nav-drawer.open{display:flex;}
    .nav-drawer a{padding:.75rem 1.5rem;color:var(--muted);text-decoration:none;font-size:.9rem;border-bottom:1px solid var(--border);}
    .nav-drawer a:hover{color:#fff;background:rgba(255,255,255,.04);}
    @media(max-width:600px){.nav-right{display:none;}.nav-burger{display:flex;}}
    .content{max-width:900px;margin:0 auto;padding:2rem 1.5rem;}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:.5rem;margin-bottom:1.2rem;}
    .live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-bottom:2rem;}
    .player-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;transition:all .3s;}
    .player-card.leading{border-color:rgba(255,215,0,.6);box-shadow:0 0 24px rgba(255,215,0,.12);background:rgba(255,215,0,.04);}
    .pc-name{font-weight:700;font-size:.95rem;margin-bottom:.6rem;}
    .pc-total{font-size:2rem;font-weight:800;color:var(--gold);line-height:1;}
    .pc-sub{font-size:.72rem;color:var(--muted);margin-top:.15rem;margin-bottom:.8rem;}
    .pc-games{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;}
    .pc-game{background:rgba(255,255,255,.05);border-radius:6px;padding:.4rem .3rem;text-align:center;}
    .pc-game-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
    .pc-game-total{font-size:.95rem;font-weight:700;color:var(--gold);}
    .pc-game-rounds{font-size:.6rem;color:var(--muted);margin-top:.15rem;}
    .controls{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.4rem;margin-bottom:2rem;}
    .ctrl-label{color:var(--gold2);font-size:.78rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:.6rem;font-weight:600;}
    .tabs-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .tab-btn{padding:.4rem .9rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,215,0,.2);background:transparent;color:var(--muted);transition:all .2s;font-family:'Poppins',sans-serif;}
    .tab-btn.active{background:rgba(255,215,0,.15);border-color:var(--gold);color:var(--gold);}
    .score-inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem;margin-bottom:1rem;}
    .score-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border-radius:8px;padding:.5rem .8rem;}
    .score-row-name{font-size:.85rem;font-weight:600;}
    .score-btns{display:flex;align-items:center;gap:.4rem;}
    .score-btns button{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:1rem;line-height:1;transition:all .2s;}
    .score-btns button:hover{background:rgba(255,215,0,.2);border-color:var(--gold);}
    .score-val{font-size:1rem;font-weight:700;color:var(--gold);min-width:20px;text-align:center;}
    .btn{padding:.55rem 1.2rem;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;border:1px solid;transition:all .2s;font-family:'Poppins',sans-serif;}
    .btn-gold{background:rgba(255,215,0,.12);border-color:var(--gold);color:var(--gold);}
    .btn-gold:hover{background:rgba(255,215,0,.25);}
    .btn-red{background:rgba(229,9,20,.12);border-color:var(--primary);color:var(--primary);}
    .btn-red:hover{background:rgba(229,9,20,.25);}
    .btn-muted{background:transparent;border-color:rgba(255,255,255,.15);color:var(--muted);}
    .btn-muted:hover{color:#fff;border-color:rgba(255,255,255,.35);}
    .round-badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,215,0,.08);border:1px solid var(--border);border-radius:8px;padding:.35rem .8rem;font-size:.78rem;color:var(--gold2);margin-bottom:1rem;}
    .divider{border:none;border-top:1px solid var(--border);margin:1rem 0;}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#222;color:#fff;border:1px solid var(--border);padding:.55rem 1.3rem;border-radius:20px;font-size:.85rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
    .toast.show{opacity:1;}
    .pulse{animation:pulse 1.5s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @media(max-width:380px){.score-inputs{grid-template-columns:1fr;}.tabs-row{gap:.3rem;}.tab-btn{padding:.35rem .6rem;font-size:.76rem;}}
  </style>
</head>
<body>
  <nav class="topnav">
    <a href="/" class="brand">MediaPedia</a>
    <div class="nav-right">
      <a href="/kingofcards" style="color:var(--gold);font-weight:700;">KOC</a>
      {% if username %}<a href="/u/{{ username }}" style="color:var(--primary);font-weight:600;">{{ username }}</a>{% endif %}
    </div>
    <button class="nav-burger" onclick="document.getElementById('live-nd').classList.toggle('open')" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-drawer" id="live-nd">
    <a href="/kingofcards" style="color:var(--gold);font-weight:600;">KOC</a>
    {% if username %}<a href="/u/{{ username }}" style="color:var(--primary);font-weight:600;">{{ username }}</a>{% endif %}
  </div>

  <div class="content">
    <!-- HEADER ROW -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;margin-bottom:1.2rem;">
      <div class="section-title" style="margin:0;border:none;">Live Tracker</div>
      <div style="display:flex;gap:.6rem;align-items:center;">
        <span class="pulse" style="width:8px;height:8px;border-radius:50%;background:#2ed573;display:inline-block;"></span>
        <span style="font-size:.8rem;color:#2ed573;">LIVE</span>
        <span id="session-id-label" style="font-size:.75rem;color:var(--muted);"></span>
        <button onclick="copyLiveLink()" style="background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);color:var(--gold);border-radius:6px;padding:.25rem .7rem;font-size:.75rem;font-weight:600;cursor:pointer;">Share Link</button>
      </div>
    </div>

    <!-- CURRENT GAME BADGE -->
    <div id="round-info" class="round-badge">Round 1 &nbsp;&bull;&nbsp; Game: <strong id="current-game-label" style="color:var(--gold);margin-left:.3rem;">Monopoly</strong></div>

    <!-- PLAYER SCORECARDS -->
    <div class="live-grid" id="player-cards"></div>

    {% if is_koc_player %}
    <!-- CONTROLS -->
    <div class="controls">
      <!-- GAME SELECTOR -->
      <div class="ctrl-label">Game</div>
      <div class="tabs-row" id="game-tabs">
        <button class="tab-btn active" onclick="setGame('monopoly',this)">Monopoly</button>
        <button class="tab-btn" onclick="setGame('bluff',this)">Bluff</button>
        <button class="tab-btn" onclick="setGame('spoon',this)">Spoon</button>
        <button class="tab-btn" onclick="setGame('uno',this)">UNO</button>
      </div>

      <!-- ROUND SELECTOR -->
      <div class="ctrl-label" style="margin-top:.8rem;">Round</div>
      <div class="tabs-row" id="round-tabs">
        <button class="tab-btn active" id="round-btn-1" onclick="setRound(1,this)">Round 1</button>
        <button class="tab-btn" id="round-btn-2" onclick="setRound(2,this)">Round 2</button>
      </div>

      <!-- SCORE INPUTS -->
      <div class="ctrl-label" style="margin-top:.8rem;">Scores — <span id="score-context" style="color:var(--gold);text-transform:none;letter-spacing:0;">Monopoly, Round 1</span></div>
      <div class="score-inputs" id="score-inputs"></div>

      <!-- ACTION BUTTONS -->
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem;">
        <button class="btn btn-gold" onclick="pushScores()">Save Scores</button>
        <button class="btn btn-gold" onclick="saveAsEdition()" style="background:rgba(255,215,0,.2);">Save as Edition</button>
        <button class="btn btn-red" onclick="endSession()">End Session</button>
      </div>

      <hr class="divider">

      <!-- ADD / REMOVE PLAYER -->
      <div class="ctrl-label">Add Player</div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;">
        <input id="new-player-name" type="text" placeholder="Display name (e.g. RAHUL)" maxlength="30"
          style="flex:1;min-width:130px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:#fff;padding:.5rem .8rem;font-size:.85rem;font-family:'Poppins',sans-serif;"
          onkeydown="if(event.key==='Enter')addPlayer()" />
        <input id="new-player-username" type="text" placeholder="Username (optional)" maxlength="30"
          style="flex:1;min-width:120px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:#fff;padding:.5rem .8rem;font-size:.85rem;font-family:'Poppins',sans-serif;"
          onkeydown="if(event.key==='Enter')addPlayer()" />
        <button class="btn btn-gold" onclick="addPlayer()">+ Add</button>
      </div>
      <div class="ctrl-label">Remove Player</div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
        <select id="remove-player-select"
          style="flex:1;min-width:150px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:#fff;padding:.5rem .8rem;font-size:.85rem;font-family:'Poppins',sans-serif;appearance:none;">
        </select>
        <button class="btn btn-red" onclick="removePlayer()">Remove</button>
      </div>
    </div>
    {% endif %}
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SESSION_ID = '{{ session_id }}';
    const IS_PLAYER = {{ 'true' if is_koc_player else 'false' }};
    const GAMES = ['monopoly','bluff','spoon','uno'];
    let KOC_PLAYERS = [
      {username:'abhinav',  display:'ABHINAV'},
      {username:'abhishek', display:'ABHISHEK'},
      {username:'akhil',    display:'AKHIL'},
      {username:'sahil',    display:'SAHIL'},
      {username:'shruti',   display:'SHRUTI'},
      {username:'utkarsh',  display:'UTKARSH'},
    ];
    let state = null;
    let currentGame = 'monopoly';
    let currentRound = 1;
    let pollInterval = null;
    let _localControl = false;
    // pending holds local score edits not yet saved to server
    let _pending = {}; // { username: { 'r1_monopoly': val, ... } }

    function key(game, round) { return 'r' + round + '_' + game; }

    function recalcTotal(scores, username) {
      let t = 0;
      GAMES.forEach(g => { t += (scores[username][key(g,1)]||0) + (scores[username][key(g,2)]||0); });
      scores[username].total = t;
    }

    // Merge _pending on top of server scores to get the view scores
    function mergedScores() {
      if (!state || !state.scores) return {};
      const merged = JSON.parse(JSON.stringify(state.scores));
      Object.keys(_pending).forEach(u => {
        if (!merged[u]) merged[u] = {};
        Object.assign(merged[u], _pending[u]);
        recalcTotal(merged, u);
      });
      return merged;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function setGame(game, btn) {
      currentGame = game;
      _localControl = true;
      document.querySelectorAll('#game-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateScoreContext();
      renderInputs();
    }

    function setRound(round, btn) {
      currentRound = round;
      _localControl = true;
      document.querySelectorAll('#round-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateScoreContext();
      renderInputs();
    }

    function updateScoreContext() {
      const el = document.getElementById('score-context');
      if (el) el.textContent = currentGame.charAt(0).toUpperCase()+currentGame.slice(1) + ', Round ' + currentRound;
    }

    function renderCards() {
      if (!state) return;
      const scores = mergedScores();
      const players = KOC_PLAYERS.filter(p => scores[p.username] !== undefined);
      const maxTotal = Math.max(...players.map(p => scores[p.username]?.total || 0), 0);
      const container = document.getElementById('player-cards');
      container.innerHTML = players
        .sort((a,b) => (scores[b.username]?.total||0) - (scores[a.username]?.total||0))
        .map(p => {
          const s = scores[p.username] || {};
          const total = s.total || 0;
          const isLeading = total === maxTotal && total > 0;
          const gameBoxes = GAMES.map(g => {
            const r1 = s[key(g,1)] || 0;
            const r2 = s[key(g,2)] || 0;
            return `<div class="pc-game">
              <div class="pc-game-label">${g.slice(0,4)}</div>
              <div class="pc-game-total">${r1+r2}</div>
              <div class="pc-game-rounds">R1:${r1} R2:${r2}</div>
            </div>`;
          }).join('');
          return `<div class="player-card ${isLeading?'leading':''}">
            <div class="pc-name">${p.display}</div>
            <div class="pc-total">${total}</div>
            <div class="pc-sub">Total Points</div>
            <div class="pc-games">${gameBoxes}</div>
          </div>`;
        }).join('');

      const cg = state.current_game || 'monopoly';
      const cr = state.current_round || 1;
      document.getElementById('current-game-label').textContent = cg.charAt(0).toUpperCase()+cg.slice(1);
      document.getElementById('round-info').innerHTML =
        `Round ${cr} &nbsp;&bull;&nbsp; Game: <strong style="color:var(--gold);margin-left:.3rem;">${cg.charAt(0).toUpperCase()+cg.slice(1)}</strong>`;
      document.getElementById('session-id-label').textContent = `#${SESSION_ID}`;
    }

    function renderInputs() {
      if (!state || !IS_PLAYER) return;
      const scores = mergedScores();
      const players = KOC_PLAYERS.filter(p => scores[p.username] !== undefined);
      document.getElementById('score-inputs').innerHTML = players.map(p => {
        const val = (scores[p.username]||{})[key(currentGame,currentRound)] || 0;
        return `<div class="score-row">
          <span class="score-row-name">${p.display}</span>
          <div class="score-btns">
            <button onclick="adjustScore('${p.username}',-1)">−</button>
            <span class="score-val" id="sv-${p.username}">${val}</span>
            <button onclick="adjustScore('${p.username}',1)">+</button>
          </div>
        </div>`;
      }).join('');
    }

    function adjustScore(username, delta) {
      if (!state) return;
      // work on _pending, not state directly
      if (!_pending[username]) {
        _pending[username] = JSON.parse(JSON.stringify(state.scores[username] || {}));
      }
      const k = key(currentGame, currentRound);
      const cur = _pending[username][k] !== undefined ? _pending[username][k] : (state.scores[username]?.[k] || 0);
      _pending[username][k] = Math.max(0, cur + delta);
      // update display inline without full re-render
      const el = document.getElementById('sv-' + username);
      if (el) el.textContent = _pending[username][k];
      renderCards();
    }

    function pushScores() {
      if (!state) return;
      // merge pending into a full scores object
      const scores = mergedScores();
      _pending = {};
      _localControl = false;
      fetch(`/api/koc/live/${SESSION_ID}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({scores, current_game: currentGame, current_round: currentRound})
      }).then(r => r.json()).then(d => {
        state = d;
        renderCards();
        renderInputs();
        showToast('Scores saved');
      });
    }

    function endSession() {
      if (!confirm('End this live session?')) return;
      fetch(`/api/koc/live/${SESSION_ID}/end`, {method:'POST'})
        .then(() => { clearInterval(pollInterval); showToast('Session ended'); setTimeout(()=>window.location.href='/kingofcards',1200); });
    }

    function saveAsEdition() {
      if (!confirm('Save current scores as a new official edition?')) return;
      const today = new Date().toISOString().slice(0,10);
      const played_on = prompt('Date played (YYYY-MM-DD):', today) || today;
      fetch(`/api/koc/live/${SESSION_ID}/save_as_edition`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({played_on})
      }).then(r=>r.json()).then(d=>{
        if (d.error) { showToast(d.error); return; }
        clearInterval(pollInterval);
        showToast('Edition ' + d.edition + ' saved!');
        setTimeout(()=>window.location.href='/kingofcards/'+d.edition, 1200);
      });
    }

    function addPlayer() {
      const nameInp = document.getElementById('new-player-name');
      const userInp = document.getElementById('new-player-username');
      const display = nameInp.value.trim().toUpperCase();
      const username = userInp.value.trim().toLowerCase() || display.toLowerCase().replace(/\s+/g,'_');
      if (!display) { showToast('Enter a display name'); return; }
      if (KOC_PLAYERS.find(p => p.username === username)) { showToast(display + ' already in session'); return; }
      KOC_PLAYERS.push({username, display});
      if (state) {
        if (!state.scores) state.scores = {};
        state.scores[username] = {};
        GAMES.forEach(g => { state.scores[username][key(g,1)]=0; state.scores[username][key(g,2)]=0; });
        state.scores[username].total = 0;
        const scores = mergedScores();
        fetch(`/api/koc/live/${SESSION_ID}`, {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({scores, current_game: currentGame, current_round: currentRound})
        }).then(r=>r.json()).then(d=>{ state=d; _pending={}; renderCards(); renderInputs(); updateRemoveSelect(); });
      }
      nameInp.value=''; userInp.value='';
      showToast(display + ' added');
    }

    function removePlayer() {
      const sel = document.getElementById('remove-player-select');
      const username = sel.value;
      if (!username) { showToast('Select a player'); return; }
      const idx = KOC_PLAYERS.findIndex(p => p.username === username);
      if (idx === -1) return;
      const display = KOC_PLAYERS[idx].display;
      KOC_PLAYERS.splice(idx, 1);
      if (state && state.scores) {
        const scores = mergedScores();
        delete scores[username];
        fetch(`/api/koc/live/${SESSION_ID}`, {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({scores, current_game: currentGame, current_round: currentRound})
        }).then(r=>r.json()).then(d=>{ state=d; delete _pending[username]; renderCards(); renderInputs(); updateRemoveSelect(); });
      }
      showToast(display + ' removed');
    }

    function updateRemoveSelect() {
      const sel = document.getElementById('remove-player-select');
      if (!sel) return;
      sel.innerHTML = '<option value="">-- Select player --</option>' +
        KOC_PLAYERS.map(p=>`<option value="${p.username}">${p.display}</option>`).join('');
    }

    function copyLiveLink() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({title:'KOC Live', text:'Watch the live KOC scoreboard:', url}).catch(()=>{});
      } else {
        navigator.clipboard.writeText(url).then(()=>showToast('Live link copied!')).catch(()=>showToast(url));
      }
    }

    function poll() {
      fetch(`/api/koc/live/${SESSION_ID}`)
        .then(r => r.json())
        .then(d => {
          if (d.error) return;
          if (!d.active) {
            clearInterval(pollInterval);
            showToast('Session ended');
            setTimeout(()=>window.location.href='/kingofcards',1500);
            return;
          }
          // migrate old flat scores to r1_/r2_ format if needed
          if (d.scores) {
            Object.keys(d.scores).forEach(u => {
              GAMES.forEach(g => {
                if (d.scores[u][g] !== undefined && d.scores[u][key(g,1)] === undefined) {
                  d.scores[u][key(g,1)] = d.scores[u][g];
                  d.scores[u][key(g,2)] = 0;
                  delete d.scores[u][g];
                }
                if (d.scores[u][key(g,1)] === undefined) d.scores[u][key(g,1)] = 0;
                if (d.scores[u][key(g,2)] === undefined) d.scores[u][key(g,2)] = 0;
              });
            });
          }
          state = d;
          // only sync game/round tabs if player hasn't taken local control
          if (IS_PLAYER && !_localControl) {
            if (d.current_game && d.current_game !== currentGame) {
              currentGame = d.current_game;
              document.querySelectorAll('#game-tabs .tab-btn').forEach((b, i) => {
                b.classList.toggle('active', ['monopoly','bluff','spoon','uno'][i] === currentGame);
              });
            }
            if (d.current_round && d.current_round !== currentRound) {
              currentRound = d.current_round;
              document.querySelectorAll('#round-tabs .tab-btn').forEach(b => b.classList.remove('active'));
              const rb = document.getElementById('round-btn-' + currentRound);
              if (rb) rb.classList.add('active');
            }
            updateScoreContext();
          }
          renderCards();
          // only re-render inputs if no pending local edits (avoids overwriting in-progress scoring)
          if (IS_PLAYER && Object.keys(_pending).length === 0) renderInputs();
        });
    }

    // init
    poll();
    pollInterval = setInterval(poll, 4000);
    if (IS_PLAYER) updateRemoveSelect();
  </script>
</body>
</html>
