<!DOCTYPE html>
<html>
<head>
  <title>KOC Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="{{ url_for('static', filename='koc/icon.png') }}" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#ffd700;--gold2:#b8860b;--bg:#0d0d0d;--card:rgba(255,215,0,0.04);--border:rgba(255,215,0,0.12);--text:#fff;--muted:#888;--primary:#e50914; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh;}
    .topnav{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,13,13,.97);backdrop-filter:blur(8px);z-index:100;gap:.8rem;}
    .topnav a{color:var(--muted);text-decoration:none;font-size:.85rem;transition:color .2s;}
    .topnav a:hover{color:#fff;} .topnav .brand{color:var(--primary);font-weight:700;}
    .content{max-width:900px;margin:0 auto;padding:2rem 1.5rem;}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:.5rem;margin-bottom:1.2rem;}
    /* LIVE GRID */
    .live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-bottom:2rem;}
    .player-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;transition:all .2s;}
    .player-card.leading{border-color:rgba(255,215,0,.5);box-shadow:0 0 20px rgba(255,215,0,.1);}
    .pc-name{font-weight:700;font-size:.95rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem;}
    .pc-total{font-size:2rem;font-weight:800;color:var(--gold);line-height:1;}
    .pc-sub{font-size:.72rem;color:var(--muted);margin-top:.2rem;}
    .pc-games{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.8rem;}
    .pc-game{background:rgba(255,255,255,.05);border-radius:6px;padding:.35rem;text-align:center;}
    .pc-game-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
    .pc-game-val{font-size:1rem;font-weight:700;color:var(--gold);}
    /* CONTROLS */
    .controls{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.4rem;margin-bottom:2rem;}
    .controls h3{color:var(--gold2);font-size:.85rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem;}
    .game-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;}
    .game-tab{padding:.4rem .9rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,215,0,.2);background:transparent;color:var(--muted);transition:all .2s;}
    .game-tab.active{background:rgba(255,215,0,.15);border-color:var(--gold);color:var(--gold);}
    .score-inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.6rem;}
    .score-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border-radius:8px;padding:.5rem .8rem;}
    .score-row span{font-size:.85rem;font-weight:600;}
    .score-btns{display:flex;align-items:center;gap:.4rem;}
    .score-btns button{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:1rem;line-height:1;transition:all .2s;}
    .score-btns button:hover{background:rgba(255,215,0,.2);border-color:var(--gold);}
    .score-val{font-size:1rem;font-weight:700;color:var(--gold);min-width:20px;text-align:center;}
    .btn{padding:.55rem 1.2rem;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;border:1px solid;transition:all .2s;}
    .btn-gold{background:rgba(255,215,0,.12);border-color:var(--gold);color:var(--gold);}
    .btn-gold:hover{background:rgba(255,215,0,.25);}
    .btn-red{background:rgba(229,9,20,.12);border-color:var(--primary);color:var(--primary);}
    .btn-red:hover{background:rgba(229,9,20,.25);}
    .btn-muted{background:transparent;border-color:rgba(255,255,255,.15);color:var(--muted);}
    .round-badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,215,0,.08);border:1px solid var(--border);border-radius:8px;padding:.35rem .8rem;font-size:.78rem;color:var(--gold2);margin-bottom:1rem;}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#222;color:#fff;border:1px solid var(--border);padding:.55rem 1.3rem;border-radius:20px;font-size:.85rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
    .toast.show{opacity:1;}
    .pulse{animation:pulse 1.5s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  </style>
</head>
<body>
  <nav class="topnav">
    <a href="/" class="brand">MediaPedia</a>
    <a href="/kingofcards" style="color:var(--gold);font-weight:700;">👑 KOC</a>
    {% if username %}<a href="/u/{{ username }}" style="color:var(--primary);font-weight:600;">{{ username }}</a>{% endif %}
  </nav>

  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;margin-bottom:1.5rem;">
      <div class="section-title" style="margin:0;border:none;">🃏 Live Tracker</div>
      <div style="display:flex;gap:.6rem;align-items:center;">
        <span class="pulse" style="width:8px;height:8px;border-radius:50%;background:#2ed573;display:inline-block;"></span>
        <span style="font-size:.8rem;color:#2ed573;">LIVE</span>
        <span id="session-id-label" style="font-size:.75rem;color:var(--muted);margin-left:.5rem;"></span>
      </div>
    </div>

    <!-- ROUND INDICATOR -->
    <div id="round-info" class="round-badge">Round 1 &nbsp;•&nbsp; Game: <strong id="current-game-label" style="color:var(--gold);margin-left:.3rem;">Monopoly</strong></div>

    <!-- PLAYER SCORECARDS -->
    <div class="live-grid" id="player-cards"></div>

    {% if is_koc_player %}
    <!-- SCORE CONTROLS -->
    <div class="controls">
      <h3>Update Scores</h3>
      <div class="game-tabs">
        <button class="game-tab active" onclick="setGame('monopoly',this)">🎯 Monopoly</button>
        <button class="game-tab" onclick="setGame('bluff',this)">🃏 Bluff</button>
        <button class="game-tab" onclick="setGame('spoon',this)">🥄 Spoon</button>
        <button class="game-tab" onclick="setGame('uno',this)">🎴 UNO</button>
      </div>
      <div class="score-inputs" id="score-inputs"></div>
      <div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap;">
        <button class="btn btn-gold" onclick="pushScores()">Save Scores</button>
        <button class="btn btn-muted" onclick="nextRound()">Next Round →</button>
        <button class="btn btn-gold" onclick="saveAsEdition()" style="background:rgba(255,215,0,.2);">💾 Save as Edition</button>
        <button class="btn btn-red" onclick="endSession()">End Session</button>
      </div>
    </div>
    {% endif %}
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SESSION_ID = '{{ session_id }}';
    const IS_PLAYER = {{ 'true' if is_koc_player else 'false' }};
    const KOC_PLAYERS = [
      {username:'abhinav',  display:'ABHINAV'},
      {username:'abhishek', display:'ABHISHEK'},
      {username:'akhil',    display:'AKHIL'},
      {username:'sahil',    display:'SAHIL'},
      {username:'shruti',   display:'SHRUTI'},
      {username:'utkarsh',  display:'UTKARSH'},
    ];
    const GAMES = ['monopoly','bluff','spoon','uno'];
    let state = null;
    let currentGame = 'monopoly';
    let pollInterval = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function setGame(game, btn) {
      currentGame = game;
      document.querySelectorAll('.game-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderInputs();
    }

    function renderCards() {
      if (!state) return;
      const scores = state.scores || {};
      const players = KOC_PLAYERS.filter(p => scores[p.username]);
      const maxTotal = Math.max(...players.map(p => scores[p.username]?.total || 0));
      const container = document.getElementById('player-cards');
      container.innerHTML = players
        .sort((a,b) => (scores[b.username]?.total||0) - (scores[a.username]?.total||0))
        .map((p,i) => {
          const s = scores[p.username] || {};
          const total = s.total || 0;
          const isLeading = total === maxTotal && total > 0;
          return `<div class="player-card ${isLeading?'leading':''}">
            <div class="pc-name">${isLeading?'👑 ':''}${p.display}</div>
            <div class="pc-total">${total}</div>
            <div class="pc-sub">Total Points</div>
            <div class="pc-games">
              ${GAMES.map(g=>`<div class="pc-game"><div class="pc-game-label">${g.slice(0,4)}</div><div class="pc-game-val">${s[g]||0}</div></div>`).join('')}
            </div>
          </div>`;
        }).join('');

      document.getElementById('current-game-label').textContent =
        (state.current_game||'monopoly').charAt(0).toUpperCase() + (state.current_game||'monopoly').slice(1);
      document.getElementById('round-info').innerHTML =
        `Round ${state.round||1} &nbsp;•&nbsp; Game: <strong style="color:var(--gold);margin-left:.3rem;">${(state.current_game||'monopoly').charAt(0).toUpperCase()+(state.current_game||'monopoly').slice(1)}</strong>`;
      document.getElementById('session-id-label').textContent = `#${SESSION_ID}`;
    }

    function renderInputs() {
      if (!state || !IS_PLAYER) return;
      const scores = state.scores || {};
      const players = KOC_PLAYERS.filter(p => scores[p.username] !== undefined);
      document.getElementById('score-inputs').innerHTML = players.map(p => {
        const val = (scores[p.username]||{})[currentGame] || 0;
        return `<div class="score-row">
          <span>${p.display}</span>
          <div class="score-btns">
            <button onclick="adjustScore('${p.username}',-1)">−</button>
            <span class="score-val" id="sv-${p.username}">${val}</span>
            <button onclick="adjustScore('${p.username}',1)">+</button>
          </div>
        </div>`;
      }).join('');
    }

    function adjustScore(username, delta) {
      if (!state) return;
      if (!state.scores[username]) state.scores[username] = {monopoly:0,bluff:0,spoon:0,uno:0,total:0};
      const cur = state.scores[username][currentGame] || 0;
      const newVal = Math.max(0, cur + delta);
      state.scores[username][currentGame] = newVal;
      // Recalculate total
      state.scores[username].total = GAMES.reduce((s,g) => s + (state.scores[username][g]||0), 0);
      const el = document.getElementById('sv-' + username);
      if (el) el.textContent = newVal;
      renderCards();
    }

    function pushScores() {
      if (!state) return;
      fetch(`/api/koc/live/${SESSION_ID}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({scores: state.scores, current_game: currentGame, round: state.round})
      }).then(r => r.json()).then(d => { state = d; showToast('Scores saved'); });
    }

    function nextRound() {
      if (!state) return;
      const games = GAMES;
      const idx = games.indexOf(state.current_game || 'monopoly');
      let nextGame = games[(idx+1) % games.length];
      let nextRound = state.round || 1;
      if (idx === games.length-1) nextRound++;
      fetch(`/api/koc/live/${SESSION_ID}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({scores: state.scores, current_game: nextGame, round: nextRound})
      }).then(r => r.json()).then(d => {
        state = d; currentGame = nextGame;
        document.querySelectorAll('.game-tab').forEach((b,i) => b.classList.toggle('active', GAMES[i]===nextGame));
        renderCards(); renderInputs();
        showToast(`Round ${nextRound} — ${nextGame.charAt(0).toUpperCase()+nextGame.slice(1)}`);
      });
    }

    function endSession() {
      if (!confirm('End this live session?')) return;
      fetch(`/api/koc/live/${SESSION_ID}/end`, {method:'POST'})
        .then(() => { clearInterval(pollInterval); showToast('Session ended'); setTimeout(()=>window.location.href='/kingofcards',1200); });
    }

    function saveAsEdition() {
      if (!confirm('Save current scores as a new official edition?')) return;
      const today = new Date().toISOString().slice(0,10);
      const played_on = prompt('Date played (YYYY-MM-DD):', today) || today;
      fetch(`/api/koc/live/${SESSION_ID}/save_as_edition`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({played_on})
      }).then(r=>r.json()).then(d=>{
        if (d.error) { showToast(d.error); return; }
        clearInterval(pollInterval);
        showToast('Edition ' + d.edition + ' saved!');
        setTimeout(()=>window.location.href='/kingofcards/'+d.edition, 1200);
      });
    }

    function poll() {
      fetch(`/api/koc/live/${SESSION_ID}`)
        .then(r => r.json())
        .then(d => {
          if (d.error) return;
          state = d;
          if (!d.active) { clearInterval(pollInterval); showToast('Session ended by host'); setTimeout(()=>window.location.href='/kingofcards',1500); return; }
          renderCards();
          if (IS_PLAYER) renderInputs();
        });
    }

    // Initial load
    poll();
    pollInterval = setInterval(poll, 4000);
  </script>
</body>
</html>
