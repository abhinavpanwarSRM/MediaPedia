<!DOCTYPE html>
<html>
<head>
  <title>{{ franchise_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/x-icon" />
  <style>
    :root { --primary: #e50914; --bg: #141414; --text: #fff; --grey: #ccc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 2rem 1rem; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    .back { display: inline-block; margin-bottom: 1.5rem; color: var(--primary); text-decoration: none; font-size: 0.9rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); border-bottom: 2px solid rgba(229,9,20,0.3); padding-bottom: 1rem; margin-bottom: 2rem; }
    .timeline { display: flex; flex-direction: column; gap: 1rem; position: relative; padding-left: 2rem; }
    .timeline::before { content: ''; position: absolute; left: 0.5rem; top: 0; bottom: 0; width: 2px; background: rgba(229,9,20,0.3); }
    .entry { position: relative; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 1rem 1.2rem; border-left: 3px solid var(--primary); text-decoration: none; color: var(--text); display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .entry::before { content: ''; position: absolute; left: -2.15rem; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
    .entry:hover { background: rgba(229,9,20,0.1); }
    .title { font-weight: 600; font-size: 1rem; }
    .meta { font-size: 0.82rem; color: var(--grey); margin-top: 0.2rem; }
    .rating { font-size: 1.1rem; font-weight: 700; color: var(--primary); white-space: nowrap; margin-left: 1rem; }
    @media (max-width: 480px) {
      body { padding: 1.2rem 0.6rem; }
      .timeline { padding-left: 1.2rem; }
      .entry { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
      .entry::before { left: -1.45rem; }
      .rating { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back">← Back to Home</a>
    <h1>{{ franchise_name }} Franchise</h1>
    <div class="timeline">
      {% for m in movies %}
      <a class="entry" href="/movie/{{ m['ID'] }}">
        <div>
          <div class="title">{{ m['Movie Name'] }}</div>
          <div class="meta">{{ m.get('Genre','') }} &bull; {{ m.get('Year','N/A') }}</div>
        </div>
        <div class="rating">★ {{ m['Rating'] }}</div>
      </a>
      {% endfor %}
    </div>
  </div>
</body>
</html>
