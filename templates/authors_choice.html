<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.png') }}"
      type="image/x-icon"
    />
    <title>Author's Choice</title>
    <style>
      :root {
        --primary: #e50914; /* Netflix red */
        --secondary: #141414;
        --dark-bg: #181818;
        --text-light: #ffffff;
        --text-grey: #e5e5e5;
        --card-bg: rgba(20, 20, 20, 0.9);
        --series-primary: #00a8e1; /* Blue for series */
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--secondary);
        color: var(--text-light);
        line-height: 1.6;
        padding: 0;
        cursor: default;
        min-height: 100vh;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: black;
        border-radius: 8px;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      header {
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.7) 0%,
          rgba(20, 20, 20, 0.5) 100%
        );
        padding: 20px 0;
        position: relative;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        color: white;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .subtitle {
        font-size: 1.2rem;
        opacity: 0.9;
        color: var(--text-grey);
      }

      .stats {
        display: flex;
        gap: 20px;
        margin: 15px 0;
        flex-wrap: wrap;
        justify-content: center;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.1);
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 0.9rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .stat-item .count {
        color: var(--primary);
        font-weight: bold;
        font-size: 1.1rem;
      }

      .section-title {
        margin: 30px 0 15px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--primary);
        color: var(--text-light);
        font-size: 1.5rem;
        font-weight: 600;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .section-title.series-title {
        border-bottom-color: var(--series-primary);
      }

      .section-title::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 60px;
        height: 2px;
        background: var(--primary);
      }

      .section-title.series-title::after {
        background: var(--series-primary);
      }

      .media-section {
        margin-bottom: 40px;
      }

      .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }

      .media-card {
        background-color: var(--card-bg);
        border-radius: 8px;
        padding: 15px;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        display: block;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        height: 100%;
      }

      .media-card:hover {
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        background-color: rgba(36, 36, 36, 0.95);
      }

      .series-card:hover {
        border-left: 3px solid var(--series-primary);
      }

      .movie-card:hover {
        border-left: 3px solid var(--primary);
      }

      .media-title {
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--text-light);
        font-size: 1rem;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .media-details {
        font-size: 0.85rem;
        color: var(--text-grey);
      }

      .media-details div {
        margin-bottom: 5px;
      }

      .media-type {
        display: inline-block;
        padding: 3px 8px;
        background: rgba(229, 9, 20, 0.2);
        color: var(--primary);
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-top: 5px;
      }

      .series-type {
        background: rgba(0, 168, 225, 0.2);
        color: var(--series-primary);
      }

      .category-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 5px;
      }

      .category-tab {
        padding: 8px 16px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        white-space: nowrap;
        font-size: 0.9rem;
      }

      .category-tab.active {
        background: var(--primary);
        color: white;
      }

      .category-tab:hover:not(.active) {
        background: rgba(255, 255, 255, 0.2);
      }

      .search-container {
        margin: 20px 0;
        display: flex;
        justify-content: center;
      }

      .search-box {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        padding: 10px 20px;
        color: white;
        width: 100%;
        max-width: 400px;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .search-box:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.2);
      }

      .no-results {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-grey);
        font-size: 1.1rem;
        grid-column: 1 / -1;
      }

      .back-link {
        margin-top: 1.5rem;
        display: inline-block;
        padding: 0.8rem 1.5rem;
        background: rgba(229, 9, 20, 0.2);
        color: white;
        text-decoration: none;
        border-radius: 6px;
        transition: all 0.3s ease;
        font-weight: 500;
        border: 1px solid rgba(229, 9, 20, 0.3);
        width: 100%;
        text-align: center;
      }

      .back-link:hover {
        background: rgba(229, 9, 20, 0.3);
        transform: translateY(-2px);
      }

      @media (max-width: 768px) {
        .media-grid {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 15px;
        }

        .section-title {
          font-size: 1.3rem;
        }

        h1 {
          font-size: 2rem;
        }

        .stats {
          gap: 10px;
        }

        .stat-item {
          padding: 8px 12px;
          font-size: 0.8rem;
        }

        .back-link {
          width: auto;
        }
      }

      @media (max-width: 480px) {
        .media-grid {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 10px;
        }

        .media-card {
          padding: 10px;
        }

        .media-title {
          font-size: 0.9rem;
        }

        .section-title {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .category-tabs {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

      // Calculate counts
      function calculateCounts() {
        // Series count
        const seriesCount = seriesData.length;

        // Movies count
        const moviesCount = Object.values(moviesData).reduce(
          (total, category) => total + category.length,
          0
        );

        // Categories count
        const categoriesCount = Object.keys(moviesData).length;

        // Update header stats
        document.getElementById("series-count").textContent = seriesCount;
        document.getElementById("movies-count").textContent = moviesCount;
        document.getElementById("categories-count").textContent =
          categoriesCount;

        // Update section counts
        document.getElementById("series-section-count").textContent =
          seriesCount;
        document.getElementById("movies-section-count").textContent =
          moviesCount;

        return { seriesCount, moviesCount, categoriesCount };
      }

      // Create category tabs
      function createCategoryTabs() {
        const movieTabs = document.getElementById("movie-tabs");
        const counts = calculateCounts();

        // All movies tab
        const allTab = document.createElement("div");
        allTab.classList.add("category-tab", "active");
        allTab.dataset.category = "all";
        allTab.textContent = `All Movies (${counts.moviesCount})`;
        movieTabs.appendChild(allTab);

        // Individual category tabs
        Object.entries(moviesData).forEach(([category, movies]) => {
          const tab = document.createElement("div");
          tab.classList.add("category-tab");
          tab.dataset.category = category;

          // Format category name
          const categoryName =
            category.charAt(0).toUpperCase() + category.slice(1);
          tab.textContent = `${categoryName} (${movies.length})`;
          movieTabs.appendChild(tab);
        });
      }

      // Populate Series
      const seriesList = document.getElementById("series-list");

      function renderSeries() {
        seriesList.innerHTML = "";
        seriesData.forEach((series) => {
          const card = document.createElement("a");
          card.classList.add("media-card", "series-card");

          // Use ID if available, otherwise fallback to title slug
          const seriesId =
            series.id || series.title.toLowerCase().replace(/\s+/g, "-");
          card.href = `/series/${seriesId}`;

          card.innerHTML = `
                    <div class="media-title">${series.title}</div>
                    <div class="media-details">
                        <div>TV Series</div>
                        <div class="media-type series-type">Series</div>
                    </div>
                `;
          seriesList.appendChild(card);
        });
      }

      // Populate Movies
      const moviesList = document.getElementById("movies-list");
      let currentCategory = "all";

      function renderMovies(category = "all") {
        moviesList.innerHTML = "";
        currentCategory = category;

        // Update active tab
        document.querySelectorAll(".category-tab").forEach((tab) => {
          if (tab.dataset.category === category) {
            tab.classList.add("active");
          } else {
            tab.classList.remove("active");
          }
        });

        // Render movies based on category
        if (category === "all" || category === "english") {
          moviesData.english.forEach((movie) => {
            const card = document.createElement("a");
            card.classList.add("media-card", "movie-card");

            // Use ID if available, otherwise fallback to title slug
            const movieId =
              movie.id || movie.title.toLowerCase().replace(/\s+/g, "-");
            card.href = `/movie/${movieId}`;

            card.innerHTML = `
                        <div class="media-title">${movie.title}</div>
                        <div class="media-details">
                            <div class="media-type">English</div>
                        </div>
                    `;
            moviesList.appendChild(card);
          });
        }

        if (category === "all" || category === "hindi") {
          moviesData.hindi.forEach((movie) => {
            const card = document.createElement("a");
            card.classList.add("media-card", "movie-card");

            // Use ID if available, otherwise fallback to title slug
            const movieId =
              movie.id || movie.title.toLowerCase().replace(/\s+/g, "-");
            card.href = `/movie/${movieId}`;

            card.innerHTML = `
                        <div class="media-title">${movie.title}</div>
                        <div class="media-details">
                            <div class="media-type">Hindi</div>
                        </div>
                    `;
            moviesList.appendChild(card);
          });
        }

        if (category === "all" || category === "anime") {
          moviesData.anime.forEach((movie) => {
            const card = document.createElement("a");
            card.classList.add("media-card", "movie-card");

            // Use ID if available, otherwise fallback to title slug
            const movieId =
              movie.id || movie.title.toLowerCase().replace(/\s+/g, "-");
            card.href = `/movie/${movieId}`;

            card.innerHTML = `

                        <div class="media-details">

          });
        }

        if (category === "all" || category === "korean") {
          moviesData.korean.forEach((movie) => {
            const card = document.createElement("a");
            card.classList.add("media-card", "movie-card");

            // Use ID if available, otherwise fallback to title slug
            const movieId =
              movie.id || movie.title.toLowerCase().replace(/\s+/g, "-");
            card.href = `/movie/${movieId}`;

            card.innerHTML = `
                        <div class="media-title">${movie.title}</div>
                        <div class="media-details">
                            <div class="media-type">Korean</div>
                        </div>
                    `;
            moviesList.appendChild(card);
          });
        }
      }

      // Initialize the page
      function initializePage() {
        // Calculate and update all counts
        calculateCounts();

        // Create category tabs
        createCategoryTabs();

        // Render series and movies
        renderSeries();
        renderMovies();

        // Add event listeners to category tabs
        document.querySelectorAll(".category-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            renderMovies(tab.dataset.category);
          });
        });
      }

      // Search functionality
      const searchInput = document.getElementById("search-input");

      searchInput.addEventListener("input", function () {
        const searchTerm = this.value.toLowerCase().trim();

        if (searchTerm === "") {
          renderSeries();
          renderMovies(currentCategory);
          return;
        }

        // Filter series
        const filteredSeries = seriesData.filter((series) =>
          series.title.toLowerCase().includes(searchTerm)
        );

        seriesList.innerHTML = "";
        if (filteredSeries.length > 0) {
          filteredSeries.forEach((series) => {
            const card = document.createElement("a");
            card.classList.add("media-card", "series-card");

            // Use ID if available, otherwise fallback to title slug
            const seriesId =
              series.id || series.title.toLowerCase().replace(/\s+/g, "-");
            card.href = `/series/${seriesId}`;

            card.innerHTML = `
                        <div class="media-title">${series.title}</div>
                        <div class="media-details">
                            <div>TV Series</div>
                            <div class="media-type series-type">Series</div>
                        </div>
                    `;
            seriesList.appendChild(card);
          });
        } else {
          seriesList.innerHTML =
            '<div class="no-results">No series found matching your search</div>';
        }

        // Filter movies
        const allMovies = [
          ...moviesData.english.map((movie) => ({
            title: movie.title,
            type: "English",
            id: movie.id,
          })),
          ...moviesData.hindi.map((movie) => ({
            title: movie.title,
            type: "Hindi",
            id: movie.id,
          })),
          ...moviesData.anime.map((movie) => ({
            title: movie.title,
            type: "Anime",
            id: movie.id,
          })),
          ...moviesData.korean.map((movie) => ({
            title: movie.title,
            type: "Korean",
            id: movie.id,
          })),
        ];

        const filteredMovies = allMovies.filter((movie) =>
          movie.title.toLowerCase().includes(searchTerm)
        );

        moviesList.innerHTML = "";
        if (filteredMovies.length > 0) {
          filteredMovies.forEach((movie) => {
            const card = document.createElement("a");
            card.classList.add("media-card", "movie-card");

            // Use ID if available, otherwise fallback to title slug
            const movieId =
              movie.id || movie.title.toLowerCase().replace(/\s+/g, "-");
            card.href = `/movie/${movieId}`;

            card.innerHTML = `
                        <div class="media-title">${movie.title}</div>
                        <div class="media-details">
                            <div class="media-type">${movie.type}</div>
                        </div>
                    `;
            moviesList.appendChild(card);
          });
        } else {
          moviesList.innerHTML =
            '<div class="no-results">No movies found matching your search</div>';
        }
      });

      // Initialize the page when DOM is loaded
      document.addEventListener("DOMContentLoaded", initializePage);
    </script>
  </body>
</html>
