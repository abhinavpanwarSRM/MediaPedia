<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --primary: #e50914; --bg: #141414; --card: rgba(14,14,14,0.92); --border: rgba(255,255,255,0.08); --muted: #888; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg); color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem; position: relative; overflow: hidden;
    }

    /* Poster backdrop */
    .bg-overlay {
      position: fixed; inset: 0;
      background-size: cover; background-position: center; background-attachment: fixed;
      z-index: 0;
    }
    .bg-overlay::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(0,0,0,0.78);
    }

    /* Card */
    .card {
      position: relative; z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.8rem 2.2rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }

    /* Brand */
    .brand {
      text-align: center; margin-bottom: 2rem;
    }
    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem; font-weight: 600; letter-spacing: 1px;
      color: #fff; text-decoration: none; display: block;
      position: relative; display: inline-block;
    }
    .brand-title::after {
      content: ''; display: block;
      width: 60%; height: 2px; background: var(--primary);
      margin: 6px auto 0;
    }
    .brand-sub {
      font-size: 0.72rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 3px; margin-top: 0.4rem;
    }

    h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.25rem; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.8rem; font-weight: 300; }

    label {
      display: block; color: #aaa; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 0.35rem;
    }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 0.7rem 0.95rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border); border-radius: 6px;
      color: #fff; font-size: 0.92rem; font-family: inherit;
      margin-bottom: 1.2rem; transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: var(--primary); }

    .btn {
      width: 100%; padding: 0.78rem;
      background: var(--primary); color: #fff; border: none;
      border-radius: 6px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.3px; margin-top: 0.2rem;
    }
    .btn:hover { background: #f40612; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .error {
      background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.4);
      color: #ff6b6b; padding: 0.7rem 1rem; border-radius: 6px;
      font-size: 0.85rem; margin-bottom: 1.2rem;
    }

    .footer { text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: 0.85rem; }
    .footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }

    .back {
      display: block; text-align: center; margin-bottom: 1.4rem;
      color: var(--muted); text-decoration: none; font-size: 0.82rem;
      transition: color 0.2s;
    }
    .back:hover { color: #fff; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 0.8rem;
      margin: 1.4rem 0 1.2rem; color: var(--muted); font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
  </style>
    <link rel="manifest" href="/static/manifest.json" />
</head>
<body>
  <div class="bg-overlay" id="bg"></div>

  <div class="card">
    <div class="brand">
      <a href="/" class="brand-title">MEDIA PEDIA</a>
      <div class="brand-sub">Your Personalized Guide</div>
    </div>

    <a href="/" class="back">← Back to MediaPedia</a>

    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required autofocus />
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required />
      <button class="btn" type="submit">Sign In</button>
    </form>

    <div class="divider">or</div>
    <div class="footer">Don't have an account? <a href="/register">Register for free</a></div>
  </div>

  <script>
    const posters = [
      "{{ url_for('static', filename='poster/poster1.jpg') }}",
      "{{ url_for('static', filename='poster/poster2.jpg') }}",
      "{{ url_for('static', filename='poster/poster3.jpg') }}",
      "{{ url_for('static', filename='poster/poster4.jpg') }}",
      "{{ url_for('static', filename='poster/poster5.jpg') }}",
      "{{ url_for('static', filename='poster/poster6.jpg') }}",
    ];
    document.getElementById('bg').style.backgroundImage =
      `url('${posters[Math.floor(Math.random() * posters.length)]}')`;
  </script>
    <script src="/static/pwa.js"></script>
</body>
</html>
